<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кинопоиск</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo">Кинопоиск<span>.</span></div>
            <div class="search-bar">
                <!-- Добавили id="search-input" для работы поиска -->
                <input type="text" id="search-input" placeholder="Поиск фильмов...">
                <button>Найти</button>
            </div>
            <!-- Сюда мы потом добавим кнопки Войти/Профиль -->
            <div class="profile" id="auth-status">Войти</div>
        </div>
    </header>

    <section class="hero container">
        <div class="hero-content">
            <h1>Дюна: Часть вторая</h1>
            <p>Пол Атрейдес объединяется с Чани и фременами, чтобы отомстить заговорщикам, уничтожившим его семью.</p>
            <div class="hero-buttons">
                <button class="btn-primary">Смотреть</button>
                <button class="btn-secondary">В трейлеры</button>
            </div>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Популярное сейчас</h2>
        
        <!-- Сетка теперь пустая, фильмы загрузятся через JS -->
        <div class="movie-grid" id="movie-grid">
            <!-- Здесь будет скелетон (заглушка), пока идет загрузка -->
            <p>Загрузка фильмов...</p>
        </div>
    </main>

    <!-- ПОДКЛЮЧАЕМ SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ВСТАВЬТЕ СЮДА ВАШИ КЛЮЧИ ИЗ SUPABASE
        const SUPABASE_URL = 'ВАШ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ВАШ_ANON_KEY';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Функция для загрузки фильмов из БД
        async function loadMovies() {
            const { data: movies, error } = await supabase
                .from('movies')
                .select('*')
                .order('rating', { ascending: false }); // Сортируем по рейтингу

            if (error) {
                console.error('Ошибка загрузки:', error);
                return;
            }

            renderMovies(movies);
        }

        // Функция для отрисовки карточек на странице
        function renderMovies(movies) {
            const grid = document.getElementById('movie-grid');
            grid.innerHTML = ''; // Очищаем экран

            movies.forEach(movie => {
                // Создаем HTML для одной карточки
                const cardHTML = `
                    <a href="#" class="movie-card">
                        <div class="poster" style="background-image: url('${movie.poster_url}');"></div>
                        <div class="movie-info">
                            <span class="rating">${movie.rating}</span>
                            <h3>${movie.title}</h3>
                            <p>${movie.year}, ${movie.genre}</p>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // РАБОЧИЙ ПОИСК
        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.movie-card');

            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Запускаем загрузку при открытии страницы
        loadMovies();
    </script>
</body>
</html>
