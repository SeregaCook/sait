<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кинопоиск</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo">Кинопоиск<span>.</span></div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск фильмов...">
                <button>Найти</button>
            </div>
            <div class="profile" id="auth-status">Войти</div>
        </div>
    </header>

    <section class="hero container">
        <div class="hero-content">
            <h1>Дюна: Часть вторая</h1>
            <p>Пол Атрейдес объединяется с Чани и фременами, чтобы отомстить заговорщикам, уничтожившим его семью.</p>
            <div class="hero-buttons">
                <button class="btn-primary">Смотреть</button>
                <button class="btn-secondary">В трейлеры</button>
            </div>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Популярное сейчас</h2>
        
        <div class="movie-grid" id="movie-grid">
            <p>Загрузка фильмов...</p>
        </div>
    </main>

    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ВСТАВЬТЕ ВАШИ КЛЮЧИ СЮДА:
        const SUPABASE_URL = 'https://queubruxsbptjizykbycc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_g6oW-l1B4QO5W2MW5LnymQ_yYZaNuTY';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Загрузка фильмов из базы
        async function loadMovies() {
            const { data: movies, error } = await supabase
                .from('movies')
                .select('*')
                .order('rating', { ascending: false });

            if (error) {
                console.error('Ошибка:', error);
                document.getElementById('movie-grid').innerHTML = '<p>Ошибка загрузки фильмов.</p>';
                return;
            }

            const grid = document.getElementById('movie-grid');
            grid.innerHTML = '';

            movies.forEach(movie => {
                const cardHTML = `
                    <a href="#" class="movie-card">
                        <div class="poster" style="background-image: url('${movie.poster_url}');"></div>
                        <div class="movie-info">
                            <span class="rating">${movie.rating}</span>
                            <h3>${movie.title}</h3>
                            <p>${movie.year}, ${movie.genre}</p>
                        </div>
                    </a>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Рабочий поиск
        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.movie-card');

            cards.forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                if (title.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Запуск
        loadMovies();
    </script>
</body>
</html>
