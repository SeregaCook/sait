<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кинопоиск</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo">Кинопоиск<span>.</span></div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск фильмов...">
                <button>Найти</button>
            </div>
            <div class="profile" id="auth-status">Войти</div>
        </div>
    </header>

    <section class="hero container">
        <div class="hero-content">
            <h1>Дюна: Часть вторая</h1>
            <p>Пол Атрейдес объединяется с Чани и фременами, чтобы отомстить заговорщикам, уничтожившим его семью.</p>
            <div class="hero-buttons">
                <button class="btn-primary">Смотреть</button>
                <button class="btn-secondary">В трейлеры</button>
            </div>
        </div>
    </section>

    <main class="container">
        <h2 class="section-title">Популярное сейчас</h2>
        <div class="movie-grid" id="movie-grid">
            <p>Загрузка фильмов...</p>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-title">Вход в аккаунт</h2>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary" id="auth-submit-btn">Войти</button>
            </form>
            <p class="toggle-text">
                <span id="toggle-auth-mode">Нет аккаунта? Зарегистрироваться</span>
            </p>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // ВАШИ КЛЮЧИ
        const SUPABASE_URL = 'https://queubruxsbptjizykbycc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_g6oW-l1B4QO5W2MW5LnymQ_yYZaNuTY';

        // Инициализация (используем имя supabaseClient, чтобы не было конфликта)
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- ЛОГИКА ЗАГРУЗКИ ФИЛЬМОВ ---
        async function loadMovies() {
            try {
                const { data: movies, error } = await supabaseClient.from('movies').select('*').order('rating', { ascending: false });
                
                if (error) {
                    console.error('Ошибка загрузки фильмов:', error);
                    document.getElementById('movie-grid').innerHTML = '<p style="color:red">Ошибка загрузки базы данных. Проверьте RLS.</p>';
                    return;
                }

                const grid = document.getElementById('movie-grid');
                
                if (!movies || movies.length === 0) {
                    grid.innerHTML = '<p>В базе данных пока нет фильмов.</p>';
                    return;
                }

                grid.innerHTML = '';
                movies.forEach(movie => {
                    grid.innerHTML += `
                        <a href="#" class="movie-card">
                            <div class="poster" style="background-image: url('${movie.poster_url}');"></div>
                            <div class="movie-info">
                                <span class="rating">${movie.rating}</span>
                                <h3>${movie.title}</h3>
                                <p>${movie.year}, ${movie.genre}</p>
                            </div>
                        </a>
                    `;
                });
            } catch (err) {
                console.error('Критическая ошибка в скрипте:', err);
            }
        }

        // --- ПОИСК ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(card => {
                const title = card.querySelector('h3').textContent.toLowerCase();
                card.style.display = title.includes(searchTerm) ? 'block' : 'none';
            });
        });

        // --- АВТОРИЗАЦИЯ (ВХОД/ВЫХОД) ---
        const modal = document.getElementById('auth-modal');
        const authStatusBtn = document.getElementById('auth-status');
        const closeBtn = document.getElementById('close-modal');
        const authForm = document.getElementById('auth-form');
        const modalTitle = document.getElementById('modal-title');
        const submitBtn = document.getElementById('auth-submit-btn');
        const toggleAuthMode = document.getElementById('toggle-auth-mode');

        let isLoginMode = true;

        authStatusBtn.addEventListener('click', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await supabaseClient.auth.signOut(); 
                return;
            }
            modal.style.display = 'flex'; 
        });

        closeBtn.addEventListener('click', () => { modal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

        toggleAuthMode.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                modalTitle.textContent = 'Вход в аккаунт';
                submitBtn.textContent = 'Войти';
                toggleAuthMode.textContent = 'Нет аккаунта? Зарегистрироваться';
            } else {
                modalTitle.textContent = 'Регистрация';
                submitBtn.textContent = 'Создать аккаунт';
                toggleAuthMode.textContent = 'Уже есть аккаунт? Войти';
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            submitBtn.textContent = 'Загрузка...';
            submitBtn.disabled = true;

            let error;
            if (isLoginMode) {
                const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });
                error = loginError;
            } else {
                const { error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                error = signUpError;
            }

            if (error) {
                alert('Ошибка: ' + error.message);
                submitBtn.textContent = isLoginMode ? 'Войти' : 'Создать аккаунт';
                submitBtn.disabled = false;
            } else {
                modal.style.display = 'none';
                authForm.reset();
            }
        });

        async function updateAuthUI() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authStatusBtn.textContent = session.user.email.split('@')[0] + ' (Выйти)';
                authStatusBtn.style.color = '#ff5500';
                authStatusBtn.style.borderColor = '#ff5500';
            } else {
                authStatusBtn.textContent = 'Войти';
                authStatusBtn.style.color = '#ffffff';
                authStatusBtn.style.borderColor = '#444';
            }
        }

        supabaseClient.auth.onAuthStateChange(() => { updateAuthUI(); });

        loadMovies();
        updateAuthUI();
    </script>
</body>
</html>
